[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "shipyard-welding-automation"
version = "0.1.0"
description = "Structured-event welding exception simulation"
requires-python = ">=3.13,<3.14"
dependencies = ["ortools==9.15.6755", "pydantic==2.14.3"]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/shipyard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
